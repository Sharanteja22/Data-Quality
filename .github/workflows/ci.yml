
name: Data Quality CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python DQ Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-engine/requirements.txt

      - name: Run Python tests
        run: python -m pytest

  java-tests:
    name: Spring Boot Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: springboot-backend

      - name: Run Maven tests
        run: ./mvnw --batch-mode clean test
        working-directory: springboot-backend

  frontend-tests:
    name: React Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: data-quality-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: data-quality-frontend

      - name: Run frontend tests
        run: npm test
        working-directory: data-quality-frontend

      - name: Build frontend
        run: npm run build
        working-directory: data-quality-frontend
