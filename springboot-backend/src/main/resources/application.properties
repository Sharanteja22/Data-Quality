spring.application.name=data-quality-backend

server.port=8080

logging.level.com.teja.data_quality_backend=INFO

# Temporarily disable automatic database configuration
# spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Python engine configuration
python.engine.executable=D:/Teja/Projects/Data-Quality/.venv/Scripts/python.exe

python.engine.script=D:/Teja/Projects/Data-Quality/python-engine/run_file_pipeline.py


# Snowflake connection
snowflake.url=jdbc:snowflake://${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com
snowflake.username=${SNOWFLAKE_USER}
snowflake.password=${SNOWFLAKE_PASSWORD}
snowflake.warehouse=${SNOWFLAKE_WAREHOUSE}
snowflake.database=${SNOWFLAKE_DATABASE}
snowflake.schema=${SNOWFLAKE_SCHEMA}
snowflake.role=${SNOWFLAKE_ROLE}

spring.sql.init.mode=never

# Snowflake JDBC Arrow compatibility
spring.datasource.hikari.data-source-properties.JDBC_QUERY_RESULT_FORMAT=JSON


# AWS S3 Configuration
aws.s3.bucket-name=teja-data-quality-storage-2026


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB